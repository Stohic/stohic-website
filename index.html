<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      script-src and style-src keep 'unsafe-inline' for two reasons: the Google
      Analytics bootstrap is an inline script, and React writes inline style
      attributes for the comparison diagram's transitions. If the contact form
      moves off mailto:, add its origin to connect-src.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.google-analytics.com https://www.googletagmanager.com; font-src 'self'; connect-src https://www.google-analytics.com https://analytics.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <title>Stohic Enclave – Collaboration that does not reveal who is talking to whom</title>
    <meta
      name="description"
      content="Stohic Enclave gives every customer its own isolated deployment, with its own entrance and an exit the customer governs. Encryption hides what you said. Enclave also hides who you said it to."
    />
    <meta name="theme-color" content="#0A1628" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/stohic-icon-transparent.png" />
    <link rel="canonical" href="https://stohic.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Stohic" />
    <meta property="og:url" content="https://stohic.com/" />
    <meta
      property="og:title"
      content="Stohic Enclave – Collaboration that does not reveal who is talking to whom"
    />
    <meta
      property="og:description"
      content="Every customer gets its own isolated deployment, with its own entrance and an exit the customer governs. From outside, there is no shared platform to enumerate."
    />
    <meta property="og:image" content="https://stohic.com/stohic-icon-transparent.png" />
    <meta property="og:image:alt" content="The Stohic mark." />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Google Analytics 4. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-EV8ZF9LW5V"></script>
    <script>
      window.dataLayer = window.dataLayer || []
      function gtag() {
        dataLayer.push(arguments)
      }
      gtag('js', new Date())
      gtag('config', 'G-EV8ZF9LW5V')
    </script>
  </body>
</html>
